[package]
name = "rustdb-manager"
version = "0.1.0"
edition = "2021"
description = "Multi-client database baseline, cloning, migration DAG, and schema drift comparator for SQL Server (and extensible via Hexagonal Architecture)"
authors = ["RustDB Team"]

[[bin]]
name = "rustdb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.6"
thiserror = "1.0"
tiberius = { package = "tiberius-ng", version = "0.13", default-features = false, features = ["tds73", "sql-browser-tokio", "native-tls", "chrono", "winauth"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.12"
